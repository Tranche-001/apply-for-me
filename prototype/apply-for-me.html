<html lang="en">

<style>
:root{

  --serif:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif;
}
html,body{margin:0;background:#F3F4F6}
body{color:#14161B;font-family:var(--sans);font-size:13px}
a{color:#4338CA}a:hover{color:#3730A3}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid #4338CA;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#6B7180}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.shell{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:#F3F4F6;color:#14161B;font-family:var(--sans);font-size:13px}
.nav{flex:1 1 220px;box-sizing:border-box;padding:20px 14px;background:#FFFFFF;border-right:1px solid #E2E4E9;display:flex;flex-direction:column;gap:24px}
@media (min-width:900px){.nav{position:sticky;top:0;height:100vh;overflow-y:auto;align-self:flex-start;max-width:260px}}
.nav-a{flex:1 1 180px;box-sizing:border-box;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;color:#353B47}
.nav-a[aria-current]{font-weight:600;color:#3730A3;background:#EEF0FE}
.nav-a:hover{background:#F3F4F6;color:#353B47}
.nav-a[aria-current]:hover{background:#E4E7FD;color:#3730A3}
.btn-p:hover:not(:disabled){background:#3730A3 !important}
.btn-s:hover:not(:disabled){border-color:#4338CA !important;color:#3730A3 !important}
.btn-d:hover{background:#912018 !important}
.icon-b:hover:not(:disabled){background:#EEF0F3 !important;color:#14161B !important}
.opt:hover{background:#F6F7F9 !important}
.pv-en{cursor:pointer;transition:background-color .35s ease, box-shadow .35s ease}
.pv-en:hover{background:#F6F7F9}
.cv-in:hover{background:#F6F7F9 !important}
.cv-in:focus{background:#FFFFFF !important;box-shadow:0 0 0 2px #C7CBFA;outline:none}
.row-ed:hover{background:#EEF0F3 !important}
.row-pen{opacity:0;transition:opacity .15s}
.row-ed:hover .row-pen,.row-ed:focus-visible .row-pen{opacity:1}
.job-o:hover{background:#F6F7F9 !important}
.add-b:hover{background:#EEF0FE !important;color:#3730A3 !important}
.warn-b{animation:warn-in .32s ease-out}
.warn-b:hover{background:#FFF5E6 !important}
@keyframes warn-in{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.warn-b{animation:none}.pv-en{transition:none}}
.x-item:hover{background:#F6F7F9 !important}
.x-item[aria-current="true"]:hover{background:#E4E7FD !important}
.chip:hover{border-color:#4338CA !important;color:#3730A3 !important;background:#F7F8FF !important}
.x-in:hover{background:#F6F7F9 !important}
.x-in:focus{background:#FFFFFF !important;box-shadow:0 0 0 2px #C7CBFA;outline:none}
.x-ta:focus{border-color:#4338CA !important;box-shadow:0 0 0 3px #DDE0FC;outline:none;background:#FFFFFF !important}
.x-del:hover{background:#FDF0EF !important}
.q-b{font:inherit;color:inherit;border:0;cursor:pointer}
.q-b:hover{background:#F6F7F9 !important}
.pill-b:hover{background:#3730A3 !important;color:#FFFFFF !important}
.pill-o:hover{border-color:#4338CA !important;color:#3730A3 !important}
.ix-a:hover{background:#EEF0F3 !important}
.sec-h:focus{outline:none}
.sec-h:focus-visible{outline:2px solid #4338CA;outline-offset:4px}
.page-h:focus{outline:none}
.link-b{padding:0;border:0;background:transparent;color:#4338CA;text-decoration:underline;font:inherit;cursor:pointer}
.link-b:hover{color:#3730A3}
textarea.grow{field-sizing:content}
.cv-page{zoom:var(--pz,1)}
@media (min-width:900px){.fit-main{height:100vh}.fit-col{max-height:100% !important}}
@media (max-width:640px){#theme-pop{left:0 !important;right:auto !important}}
@media print{.nav,.no-print{display:none !important}}

function loadDb() {

    saveState = 'off';
    return seedDb();
  }
  if (!raw) return seedDb();
  try {
    const data = JSON.parse(raw);
    if (data && data.v === 1 && Array.isArray(data.exps) && Array.isArray(data.jobs) && data.jobs.length && data.compose && data.prof) {
      return Object.assign(seedDb(), data);
    }
  } catch (err) { /* unreadable copy: start from the sample data */ }
  return seedDb();

function queueSave() {
  if (saveState === 'off') return;
  saveState = 'saving';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, SAVE_DELAY_MS);
}
function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (saveState === 'off') return;
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(db));
    saveState = 'saved';
  } catch (err) {
    const full = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
    saveState = full ? 'full' : 'off';
  }
  dirty = true;
  afterAction();

    const data = JSON.parse(ev.newValue);

      db = Object.assign(seedDb(), data);
      dirty = true;
      afterAction();

// ---- Compose CV: model ----
function comp() { return db.compose; }
function setC(patch) { setDb({ compose: Object.assign({}, db.compose, patch) }); }
function findExp(id) { return db.exps.find((e) => e.id === id) || null; }
function verOf(e, verId) { return e.versions.find((v) => v.id === verId) || e.versions[0]; }
function realBullets(v) { return v.bullets.filter((b) => b.kind !== 'MISSING'); }
function nLines(text, perLine) { return Math.max(1, Math.ceil(String(text || '').length / perLine)); }
function findJob(label) { return db.jobs.find((j) => j.label === label) || null; }
function dupJob(label) {
  const low = label.toLowerCase();
  return db.jobs.find((j) => j.label.toLowerCase() === low) || null;
}
function jobSavedText(j) {
  if (!j || !j.cv) return 'No CV yet';
  return j.savedAt && Date.now() - j.savedAt < 60000 ? 'Saved just now' : j.savedOn;
}

function entryH(e, v) {
  const bl = realBullets(v);
  const bodyLines = bl.reduce((n, b) => n + nLines(b.text, M.cpl), 0);
  const body = bl.length ? 2 + bodyLines * M.line + (bl.length - 1) : 0;
  const gap = 5;
  if (e.section === 'proj') {
    const titleLines = nLines(v.title + ' | ' + (e.stack || ''), M.titleCpl);
    return 4 + 16.2 * titleLines + 1 + body + gap;
  }
  return 4 + 16.2 + 1 + 14.9 + 1 + body + gap;
}

// Height of each profile section on the page; 0 when it is off for this CV or empty.
function profH(c) {
  const p = db.prof;
  const skillLines = p.skills.reduce((n, x) => n + nLines(x.label + ': ' + x.text, M.cpl), 0);
  return {
    edu: c.edu !== false && p.edu.length ? M.secHead + p.edu.length * M.eduEntry + M.secGap : 0,
    skills: c.skills && p.skills.length ? M.secHead + skillLines * M.skillLine + M.secGap : 0,
    ach: c.ach && p.ach.length ? M.secHead + Math.ceil(p.ach.length / 2) * M.achRow + M.secGap : 0
  };
}

// Flow the CV onto pages. A block never splits; a section that continues on the next page has no heading.
function layout(c, ctx) {
  const cx = ctx || {};
  const limit = c.pages;
  const pages = [];
  let page = null;
  let used = 0;
  let spill = '';
  const PH = profH(c);
  let total = M.header + PH.edu;
  const newPage = (label) => {
    page = { secs: [] };
    pages.push(page);
    used = 0;
    if (pages.length === limit + 1 && !spill) spill = label;
  };
  newPage('');
  used = M.header + PH.edu;
  if (PH.edu) page.secs.push({ kind: 'edu', heading: true });
  c.order.forEach((sid) => {
    let items = (c.items[sid] || []).filter((it) => !!findExp(it.id));
    if (cx.newDraft && cx.newDraft.sid === sid) items = items.concat([{ id: '__new', ver: '__new-base' }]);
    if (!items.length) return;
    let sec = null;
    items.forEach((item, idx) => {
      const e = item.id === '__new' ? cx.newDraft.e : findExp(item.id);
      const peeked = !!cx.peek && cx.peek.id === e.id;
      const drafted = cx.draftFor && cx.draftFor.id === e.id ? cx.draftFor.v : null;
      const v = drafted || verOf(e, peeked ? cx.peek.ver : item.ver);
      const h = entryH(e, v) + (idx === 0 ? M.secHead : 0);
      if (used + h > M.cap && used > 0) { newPage(e.name); sec = null; }
      if (!sec) { sec = { kind: 'entries', sid: sid, heading: idx === 0, entries: [] }; page.secs.push(sec); }
      sec.entries.push({ e: e, v: v, item: item, peeked: peeked && cx.peek.ver !== item.ver });
      used += h;
      total += h;
    });
    used += M.secGap;
    total += M.secGap;
  });
  const fixed = (kind, h, label) => {
    if (used + h > M.cap && used > 0) newPage(label);
    page.secs.push({ kind: kind, heading: true });
    used += h;
    total += h;
  };
  if (PH.skills) fixed('skills', PH.skills, 'Technical Skills');
  if (PH.ach) fixed('ach', PH.ach, 'Leadership & Achievements');
  return { pages: pages, lastUsed: used, total: total, spill: spill };
}

function fitOf(c, L) {
  const limit = c.pages;
  const n = L.pages.length;
  const over = n > limit;
  const pct = Math.min(100, Math.round((L.lastUsed / M.cap) * 100));
  const excess = L.total - limit * M.cap;
  const excessLines = Math.max(1, Math.round(excess / M.line));
  let title = 'Fits on ' + plural(n, 'page');
  let detail = 'Page ' + n + ' is ' + pct + '% full.';
  if (over) {
    title = 'Too long for ' + plural(limit, 'page');
    detail = L.spill + ' spills onto page ' + (limit + 1) + '. ' + (excess > 0 ? 'About ' + plural(excessLines, 'line') + ' too long.' : 'It doesn’t fit in the space left on page ' + limit + '.');
  } else if (n < limit) {
    detail = 'Page ' + n + ' is ' + pct + '% full, and you allow ' + plural(limit, 'page') + ', so there is room for more.';
  }
  return { limit: limit, n: n, over: over, pct: pct, excessLines: excessLines, title: title, detail: detail };
}

function suggestions(c) {
  const out = [];
  c.order.forEach((sid) => (c.items[sid] || []).forEach((item) => {
    const e = findExp(item.id);
    if (!e) return;
    const cur = verOf(e, item.ver);
    const curH = entryH(e, cur);
    let best = null;
    e.versions.forEach((v) => {
      if (v.id === cur.id) return;
      const save = curH - entryH(e, v);
      if (save >= M.line * 0.9 && (!best || save > best.save)) best = { v: v, save: save };
    });
    if (best) out.push({ e: e, v: best.v, save: best.save });
  }));
  return out.sort((a, b) => b.save - a.save).slice(0, 3);
}

function isDirty() { return snapOf(comp()) !== comp().savedSnap; }
function sectionOf(id) {
  const c = comp();

}

function moveBy(id, delta) {
  const c = comp();
  const sid = sectionOf(id);
  if (!sid) return;
  const list = c.items[sid].slice();
  const i = list.findIndex((x) => x.id === id);
  const j = i + delta;
  if (j < 0 || j >= list.length) return;
  const moving = list[i];
  list[i] = list[j];
  list[j] = moving;
  const items = Object.assign({}, c.items);
  items[sid] = list;
  setC({ items: items });
  flash(id);
  focusFirstOf([(delta < 0 ? 'up-' : 'down-') + id, (delta < 0 ? 'down-' : 'up-') + id]);
}
function moveSection(sid, delta) {
  const order = comp().order.slice();
  const i = order.indexOf(sid);
  const j = i + delta;
  if (j < 0 || j >= order.length) return;
  order[i] = order[j];
  order[j] = sid;
  setC({ order: order });
  focusFirstOf([(delta < 0 ? 'secup-' : 'secdown-') + sid, (delta < 0 ? 'secdown-' : 'secup-') + sid]);
}
// Drag one block onto another: dropping lower in the same section lands after it, otherwise before it.
function moveTo(fromId, toId) {
  const c = comp();
  const fromSid = sectionOf(fromId);
  const toSid = sectionOf(toId);
  if (!fromSid || !toSid) return;
  const moving = c.items[fromSid].find((x) => x.id === fromId);
  const fromIdx = c.items[fromSid].indexOf(moving);
  const items = Object.assign({}, c.items);
  items[fromSid] = c.items[fromSid].filter((x) => x.id !== fromId);
  const target = items[toSid].slice();
  let at = target.findIndex((x) => x.id === toId);
  if (fromSid === toSid && fromIdx <= at) at += 1;
  target.splice(at, 0, moving);
  items[toSid] = target;
  setC({ items: items });
  flash(fromId);
}
function appendTo(fromId, sid) {
  const c = comp();
  const fromSid = sectionOf(fromId);
  if (!fromSid) return;
  const moving = c.items[fromSid].find((x) => x.id === fromId);
  const items = Object.assign({}, c.items);
  items[fromSid] = c.items[fromSid].filter((x) => x.id !== fromId);
  items[sid] = items[sid].concat([moving]);
  setC({ items: items });
  flash(fromId);
}

// ---- Jobs: company + role + links + the CV saved for it ----
function linkText(url) {
  const host = url.replace(/^https?:\/\//i, '').split(/[/?#]/)[0].replace(/^www\./i, '').toLowerCase();
  if (/(^|\.)linkedin\.com$/.test(host)) return 'LinkedIn';
  if (/(^|\.)gupy\.io$/.test(host)) return 'Gupy';
  return host;
}
function normUrl(u) {
  const t = u.trim();
  if (!t) return '';
  return /^https?:\/\//i.test(t) ? t : 'https://' + t;
}
function validUrl(u) {
  return /^https?:\/\/[^\s/?#.]+(\.[^\s/?#.]+)+([/?#]\S*)?$/i.test(u);
}
// Job boards and application systems are recognised; any other link keeps the type you picked.
function guessKind(url) {
  const u = url.toLowerCase();
  if (/linkedin\.com|indeed\.|glassdoor\./.test(u)) return 'posting';
  if (/gupy\.io|greenhouse\.io|lever\.co|workday|smartrecruiters|ashbyhq|inhire|amazon\.jobs/.test(u)) return 'application';
  return null;
}
function jobLinks(j) {

    const text = linkText(l.url);
    const kind = KIND_LABELS[l.kind] || 'Link';
    return { url: l.url, text: text, kind: kind, aria: kind + ': ' + text + ' (opens in a new tab)' };
  });
}
function pickJob(label) {

  else {

// Rename a job everywhere: its CV, the versions made for it, behavioral answers and the analysis.
function renameJob(from, company, role) {
  const label = company ? company + ' · ' + role : role;
  const swap = (x) => (x === from ? label : x);
  setDb({
    jobs: db.jobs.map((j) => (j.label === from ? Object.assign({}, j, { label: label, company: company, role: role }) : j)),
    exps: db.exps.map((e) => Object.assign({}, e, {
      versions: e.versions.map((v) => Object.assign({}, v, { name: swap(v.name), apps: (v.apps || []).map(swap) }))
    }))
  });
  const tailored = {};
  Object.keys(db.beh.tailored).forEach((k) => {
    const cut = k.indexOf('|');
    tailored[k.slice(0, cut) + '|' + swap(k.slice(cut + 1))] = db.beh.tailored[k];
  });

// A job the AI hasn't analyzed: use only the versions already linked to it.
function genericPlan(job) {
  const c = comp();
  const made = db.exps
    .map((e) => ({ e: e, v: e.versions.find((v) => (v.apps || []).indexOf(job) !== -1) }))
    .filter((x) => x.v);
  if (!made.length) return null;
  const pick = (sid) => made.filter((x) => x.e.section === sid).map((x) => ({ id: x.e.id, ver: x.v.id }));
  return {
    asks: [],
    needsPosting: true,
    comp: { pages: c.pages, order: c.order.slice(), items: { exp: pick('exp'), proj: pick('proj') }, skills: true, ach: c.pages === 2 },
    report: [
      { tag: 'REUSED', text: 'The versions linked to this job: ' + made.map((x) => x.e.name + ' (“' + x.v.name + '”)').join(', ') + '.' },
      { tag: 'NOTE', text: 'The AI hasn’t read this job’s posting yet, so it used only versions already linked to it.' }

const ASK_HOME = {

let genTimer = null;
function generate() {

        report: [{ tag: 'NOTE', text: 'Nothing in your library is linked to this job yet, and the AI hasn’t read its posting. Your CV is unchanged.' }] }

  applyComp(plan.comp, {
    source: 'ai',
    aiOpen: true,

      asks: plan.asks.map((a) => Object.assign({ answer: '', status: 'open', exp: home[a.id] || null }, a)) }

// "Add to CV": the answer is filed in Experiences for the AI to draft from.
function sendAsk(id) {
  const ai = comp().ai;
  const a = ai && ai.asks.find((x) => x.id === id);
  if (!a || !a.answer.trim()) return;
  const target = db.experiences.find((x) => x.id === a.exp) || db.experiences[0];

    setDb({ experiences: db.experiences.map((x) => (x.id === target.id ? Object.assign({}, x, { text: (body ? body + '\n\n' : '') + line }) : x)) });

      '<button type="button" id="sw-cancel" class="btn-s" data-act="cancelSwitch" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #D5D8DE; background: #FFFFFF; font-size: 12.5px; font-weight: 500">Cancel</button>' +

      '<button type="button" class="btn-p" data-act="saveAndSwitch" style="height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #4338CA; background: #4338CA; color: #FFFFFF; font-size: 12.5px; font-weight: 600">Save and switch</button></div>';

  if (creating) {
    const label = newJobLabel(d);

    inner += '<h3 style="margin: 0; font-size: 13.5px; font-weight: 600">New job</h3>' +
      '<div style="display: flex; gap: 8px">' +
      '<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px"><label for="nj-company" style="font-size: 11px; font-weight: 500; color: #535A68">Company</label>' +

      '<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px"><label for="nj-role" style="font-size: 11px; font-weight: 500; color: #535A68">Role</label>' +
      '<input id="nj-role" value="' + esc(d.role) + '" data-in="njRole" placeholder="e.g. Software Engineer" aria-invalid="' + tf(roleErr) + '"' + (roleErr ? ' aria-describedby="nj-role-err"' : '') + ' style="height: 30px; box-sizing: border-box; padding: 0 8px; border: 1px solid #D5D8DE; border-radius: 6px; background: #FFFFFF; font-size: 12.5px; ' + (roleErr ? 'border-color: #B42318;' : '') + '"></div></div>' +

      each(d.links, (l, i) => {
        const bad = ui.jobTried && !!l.url.trim() && !validUrl(normUrl(l.url));
        return '<div data-key="nl-' + l.id + '" style="display: flex; align-items: center; gap: 6px">' +
          '<label for="nl-kind-' + l.id + '" class="sr">Type of link ' + (i + 1) + '</label>' +

          '<label for="nl-url-' + l.id + '" class="sr">Link ' + (i + 1) + '</label>' +
          '<input id="nl-url-' + l.id + '" type="url" value="' + esc(l.url) + '" data-in="njUrl" data-id="' + l.id + '" placeholder="https://" style="flex: 1 1 auto; min-width: 0; height: 30px; box-sizing: border-box; padding: 0 8px; border: 1px solid #D5D8DE; border-radius: 6px; font-size: 12.5px; ' + (bad ? 'border-color: #B42318;' : '') + '">' +
          '<button type="button" class="icon-b" data-act="njRemoveLink" data-id="' + l.id + '" aria-label="Remove link ' + (i + 1) + '" style="flex: 0 0 auto; width: 28px; height: 28px; ' + ST.iconB + '">' + ic('x', 14) + '</button></div>' +
          when(bad, '<span role="alert" style="padding-left: 122px; font-size: 11.5px; color: #B42318">Not a full link. Copy it from the browser’s address bar.</span>');
      }) +
      '<button type="button" data-act="njAddLink" style="align-self: flex-start; height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; font-weight: 500; color: #4338CA">' + ic('plus', 13) + 'Add link</button></div>' +
      when(!!dup, '<div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: #FFF5E6; border: 1px solid #F2CF94"><span style="flex: 1 1 auto; font-size: 12px; color: #5C2E00">You already have “' + esc(dup ? dup.label : '') + '”.</span>' +
        '<button type="button" class="btn-s" data-act="chooseDup" data-label="' + esc(dup ? dup.label : '') + '" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #E0B670; background: #FFFFFF; color: #8A4300; font-size: 12px; font-weight: 600">Open it</button></div>') +

      '<button type="button" class="btn-p" data-act="createJob" style="height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid #4338CA; background: #4338CA; color: #FFFFFF; font-size: 12.5px; font-weight: 600">Create job</button></div>';
  }

    '<span id="job-l" style="font-size: 11.5px; font-weight: 500; color: #535A68">For job</span>' +

    when(ui.jobOpen, '<div id="job-pop" role="dialog" aria-label="' + popLabel + '" style="position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 384px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 10px; background: #FFFFFF; border: 1px solid #D5D8DE; border-radius: 12px; box-shadow: 0 12px 32px rgba(20, 22, 27, 0.14); display: flex; flex-direction: column; gap: 8px">' + inner + '</div>') +

}

function composeRowsHtml(c, sid) {
  const items = c.items[sid].filter((it) => !!findExp(it.id));
  const vq = ui.verQuery.trim().toLowerCase();
  const abbr = { PROJECT: 'P', STACK: 'S', IMPACT: 'I' };
  return each(items, (item, idx) => {
    const e = findExp(item.id);
    const cur = verOf(e, item.ver);
    const open = ui.verOpen === e.id;
    const gap = cur.bullets.find((b) => b.kind === 'MISSING');
    const over = ui.overId === e.id && !!ui.dragId && ui.dragId !== e.id;
    let rowStyle = 'background: transparent; border: 1px solid transparent;';
    if (open || ui.hoverId === e.id) rowStyle = 'background: #F6F7F9; border: 1px solid #E2E4E9;';
    if (ui.flash === e.id) rowStyle = 'background: #EEF0FE; border: 1px solid #C7CBFA;';
    if (over) rowStyle = 'background: #FFFFFF; border: 1px solid #4338CA; box-shadow: 0 0 0 3px #DDE0FC;';
    if (ui.dragId === e.id) rowStyle += ' opacity: 0.45;';
    const gapText = gap ? 'This version has no ' + (gap.want || 'impact').toLowerCase() + ' bullet' : '';
    let verList = '';
    if (open) {
      const versions = e.versions
        .map((v, vi) => ({ v: v, vi: vi }))
        .filter((r) => !vq || [r.v.name, r.v.title].concat(r.v.apps || []).join(' ').toLowerCase().indexOf(vq) !== -1);
      verList = '<div role="group" aria-label="Versions of ' + esc(e.name) + '" data-leave="unpeek" style="margin: 6px 0 2px 22px; padding: 6px; border: 1px solid #D5D8DE; border-radius: 8px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(20, 22, 27, 0.08); display: flex; flex-direction: column; gap: 2px">' +
        when(e.versions.length > 5, '<input id="ver-q" type="search" aria-label="Find a version" value="' + esc(ui.verQuery) + '" data-in="verQuery" placeholder="Find a version by name, title or job" style="height: 30px; margin-bottom: 4px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D5D8DE; border-radius: 6px; font-size: 12.5px">') +
        each(versions, (r) => {
          const on = r.v.id === cur.id;
          const forJob = !!c.job && (r.v.apps || []).indexOf(c.job) !== -1;
          return '<button type="button" id="vo-' + esc(e.id) + '-' + esc(r.v.id) + '" class="opt" data-act="setVer" data-enter="peek" data-id="' + esc(e.id) + '" data-ver="' + esc(r.v.id) + '" aria-pressed="' + tf(on) + '" style="min-height: 32px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 0; border-radius: 6px; text-align: left; ' + (on ? 'background: #EEF0FE;' : 'background: transparent;') + '">' +
            '<span aria-hidden="true" style="width: 14px; display: flex; color: #4338CA">' + when(on, ic('check', 14)) + '</span>' +
            '<span style="font-size: 13px; font-weight: 600; color: #14161B">' + esc(r.v.name || 'Untitled version') + '</span>' +
            when(r.vi === 0, '<span style="padding: 1px 5px; border-radius: 4px; background: #F1F2F4; color: #353B47; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.04em">BASE</span>') +
            when(forJob, '<span style="margin-left: auto; font-size: 11.5px; font-weight: 500; color: #3730A3">Made for this job</span>') +
            '</button>';
        }) +
        when(versions.length === 0, '<p style="margin: 0; padding: 6px 8px; font-size: 12px; color: #535A68">No version matches “' + esc(ui.verQuery) + '”.</p>') +
        '</div>';
    }
    return '<li id="row-' + esc(e.id) + '" draggable="' + tf(!open) + '" data-drag="row" data-drop="row" data-id="' + esc(e.id) + '" data-enter="rowEnter" data-leave="rowLeave" style="display: block; box-sizing: border-box; padding: 6px 4px; border-radius: 8px; transition: background-color .35s ease; ' + rowStyle + '">' +
      '<div style="display: flex; align-items: center; gap: 6px">' +
      '<span aria-hidden="true" style="flex: 0 0 auto; display: flex; color: #8A90A0; cursor: grab"><svg class="i" viewBox="0 0 24 24" width="16" height="16">' + ICONS.grip + '</svg></span>' +
      '<button type="button" id="ed-btn-' + esc(e.id) + '" class="row-ed" data-act="rowEdit" data-id="' + esc(e.id) + '" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 1px; margin: -3px 0; padding: 3px 6px; border: 0; border-radius: 6px; background: transparent; text-align: left">' +
      '<span class="sr">Edit </span>' +
      '<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #14161B">' + esc(e.name) +
      when(!!gap, '<span title="' + esc(gapText) + '" style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D9A35B; background: #FFFFFF; color: #8A4300; font-family: var(--mono); font-size: 10px; font-weight: 600"><span aria-hidden="true">' + (gap ? (abbr[gap.want] || 'I') + '?' : '') + '</span><span class="sr">' + esc(gapText) + '</span></span>') +
      ic('pencil', 13, 'color: #535A68').replace('class="i"', 'class="i row-pen"') + '</span>' +
      '<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); font-size: 12px; font-style: italic; color: #535A68">' + esc(cur.title) + '</span></button>' +
      '<button type="button" id="ver-btn-' + esc(e.id) + '" class="btn-s" data-act="toggleVer" data-id="' + esc(e.id) + '" aria-expanded="' + tf(open) + '" aria-label="Version: ' + esc(cur.name || 'Untitled version') + '. Change version of ' + esc(e.name) + '" style="flex: 0 0 auto; height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 9px; border-radius: 7px; border: 1px solid #D5D8DE; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #22252C">' + esc(cur.name || 'Untitled version') + ic('down', 14) + '</button>' +
      '<button type="button" id="up-' + esc(e.id) + '" class="icon-b" data-act="rowUp" data-id="' + esc(e.id) + '"' + dis(idx === 0) + ' aria-label="Move ' + esc(e.name) + ' up" style="flex: 0 0 auto; width: 26px; height: 26px; ' + ST.iconB + '">' + ic('up', 15) + '</button>' +
      '<button type="button" id="down-' + esc(e.id) + '" class="icon-b" data-act="rowDown" data-id="' + esc(e.id) + '"' + dis(idx === items.length - 1) + ' aria-label="Move ' + esc(e.name) + ' down" style="flex: 0 0 auto; width: 26px; height: 26px; ' + ST.iconB + '">' + ic('down', 15) + '</button>' +
      '<button type="button" class="icon-b" data-act="rowRemove" data-id="' + esc(e.id) + '" aria-label="Remove ' + esc(e.name) + ' from this CV" style="flex: 0 0 auto; width: 26px; height: 26px; ' + ST.iconB + '">' + ic('x', 15) + '</button>' +
      '</div>' + verList + '</li>';
  });
}

function profileRowHtml(key, label, checked, toggleName) {
  return '<div style="position: relative"><div style="display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; background: #F6F7F9; font-size: 12.5px">' +
    '<label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" id="use-' + key + '"' + chk(checked) + ' data-ch="' + toggleName + '" style="width: 15px; height: 15px; margin: 0; accent-color: #4338CA"><span style="font-weight: 600">' + esc(label) + '</span></label>' +
    '<button type="button" id="pf-btn-' + key + '" data-act="pfToggle" data-k="' + key + '" aria-expanded="' + tf(ui.profOpen === key) + '" aria-haspopup="dialog" class="btn-s" style="margin-left: auto; height: 26px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 6px; border: 1px solid #D5D8DE; background: #FFFFFF; font-size: 12px; font-weight: 500; color: #22252C">' + ic('pencil', 12) + 'Edit<span class="sr"> ' + esc(label) + '</span></button>' +
    '</div></div>';
}

function aiReportHtml(c, isDirtyNow) {
  const ai = c.ai && c.ai.job === c.job ? c.ai : null;
  if (!ai) return '';
  const tone = {
    'NEW': 'background: #FFF5E6; color: #8A4300;',
    'REUSED': 'background: #EEF0FE; color: #3730A3;',
    'ORDER': 'background: #E6F3F1; color: #115E59;',
    'ADDED': 'background: #E7F5EC; color: #14632F;',
    'LEFT OUT': 'background: #F1F2F4; color: #353B47;',
    'NOTE': 'background: #F1F2F4; color: #353B47;'
  };
  const shown = ai.asks.filter((a) => a.status !== 'skipped');
  const waiting = shown.filter((a) => a.status === 'open').length;
  const skipped = ai.asks.length - shown.length;
  const summary = ai.canUndo ? plural(ai.report.length, 'change') + (waiting ? ' · ' + plural(waiting, 'question') + ' for you' : '') + (isDirtyNow ? ' · not saved yet' : ' · saved') : 'Your CV is unchanged.';
  return '<section aria-label="What the AI did" style="display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; border-radius: 8px; background: #F7F7FE; border: 1px solid #DDE0FC">' +
    '<div style="display: flex; align-items: center; gap: 4px 8px">' + ic('spark', 14, 'color: #4338CA') +
    '<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12.5px; font-weight: 600; color: #14161B">' + esc(ai.canUndo ? 'AI draft for ' + ai.job : 'The AI needs this job’s posting first') + '</span><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 11.5px; color: #535A68"><span>' + esc(summary) + '</span>' + sampleTag() + '</span></span>' +
    '<button type="button" data-act="toggleAi" aria-expanded="' + tf(c.aiOpen) + '" style="height: 26px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; font-weight: 600; color: #4338CA">' + (c.aiOpen ? 'Hide' : 'What it did') + '</button>' +
    when(ai.canUndo && !!c.undo, '<button type="button" id="ai-undo" class="btn-s" data-act="undoAi" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #D5D8DE; background: #FFFFFF; font-size: 12px; font-weight: 500">Undo</button>') +
    '<button type="button" class="icon-b" data-act="dismissAi" aria-label="Hide the AI report" style="width: 26px; height: 26px; ' + ST.iconB + '">' + ic('x', 14) + '</button></div>' +
    when(c.aiOpen,
      '<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px">' +
      each(ai.report, (r) => '<li style="display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.4"><span style="flex: 0 0 auto; margin-top: 1px; padding: 1px 5px; border-radius: 3px; font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; ' + (tone[r.tag] || tone.NOTE) + '">' + esc(r.tag) + '</span><span>' + esc(r.text) + '</span></li>') + '</ul>' +
      when(ai.needsPosting, '<a href="#job/' + encodeURIComponent(c.job) + '" style="font-size: 12px; font-weight: 600">Analyze this job’s posting</a>') +
      when(shown.length > 0, '<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; color: #5C2E00">It would help to have</span>' +

    sugs.push({ text: 'Leadership & Achievements: leave it out (' + plural(Math.round(profH(c).ach / M.line), 'line') + ')', action: 'Leave out', label: 'Leave Leadership & Achievements out of this CV', id: '', ver: '' });
  }
  return '<div id="fit-pop" role="dialog" aria-labelledby="fit-h" tabindex="-1" style="position: absolute; z-index: 6; top: 46px; left: 8px; right: 8px; box-sizing: border-box; padding: 12px; background: #FFFFFF; border: 1px solid #F2CF94; border-radius: 12px; box-shadow: 0 12px 32px rgba(20, 22, 27, 0.16); display: flex; flex-direction: column; gap: 8px; outline: none">' +
    '<div style="display: flex; align-items: flex-start; gap: 8px"><div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">' +

    '<p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #353B47">' + esc(fit.detail) + '</p></div>' +

    when(fit.over, '<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid #F6E3BF">' +
      '<span style="font-size: 11.5px; font-weight: 600; color: #5C2E00">' + (sugs.length || fit.limit === 1 ? 'Ways to make it fit' : 'None of these blocks has a shorter version. Remove a block or allow another page.') + '</span>' +
      when(fit.limit === 1, '<div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px"><span style="flex: 1 1 auto; min-width: 0">Keep everything and allow a second page</span><button type="button" id="fit-two" class="btn-s" data-act="setPages" data-n="2" style="flex: 0 0 auto; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid #D5D8DE; background: #FFFFFF; font-size: 12px; font-weight: 500">Allow 2 pages</button></div>') +
      each(sugs, (sg) => '<div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px"><span style="flex: 1 1 auto; min-width: 0">' + esc(sg.text) + '</span>' +
        '<button type="button" class="btn-s" data-act="' + (sg.id ? 'sugUse' : 'sugLeaveOut') + '"' + (sg.id ? ' data-enter="peek" data-leave="unpeek"' : '') + ' data-id="' + esc(sg.id) + '" data-ver="' + esc(sg.ver) + '" aria-label="' + esc(sg.label) + '" style="flex: 0 0 auto; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid #E0B670; background: #FFFFFF; color: #8A4300; font-size: 12px; font-weight: 600">' + esc(sg.action) + '</button></div>') +
      '<span style="font-size: 11px; color: #535A68">Hover a fix to see it on the page first.</span></div>') +
    when(!fit.over, '<div style="display: flex; justify-content: flex-end"><button type="button" class="btn-s" data-act="closeFit" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #D5D8DE; background: #FFFFFF; font-size: 12.5px; font-weight: 500">Done</button></div>') +

  const sourceOptions = [{ value: 'saved', label: hasSaved ? 'Saved CV for this job' : 'Saved CV for this job (none yet)', disabled: !hasSaved }];

        '<span aria-hidden="true" style="flex: 0 0 auto; padding-top: 3px; font-size: 13.5px; font-weight: 700">:</span>' +

    }) + '</ul>' + when(!list.length, '<p style="margin: 0; font-size: 12.5px; font-style: italic; color: #6B7180">No skills lines yet.</p>');

      const n = i + 1;

        '<label for="' + pfId(pre, key, 'tit', x.id) + '" class="sr">Item ' + n + ': title</label><input' + inp(x, 'title', { idf: 'tit' }) + ' value="' + esc(x.title) + '" placeholder="Title" style="height: 25px; margin-left: -6px; padding: 0 6px; box-sizing: border-box; ' + serifIn + ' font-size: 13.5px; font-weight: 700">' +

const KIND_OPTIONS = [['PROJECT', 'P'], ['STACK', 'S'], ['IMPACT', 'I'], ['PROJECT · STACK', 'P·S'], ['PROJECT · IMPACT', 'P·I'], ['STACK · IMPACT', 'S·I']];

// ---- Compose CV: handlers ----
const dataId = (el) => el.getAttribute('data-id');
H.setPages = (el) => {
  setC({ pages: Number(el.getAttribute('data-n')) === 2 ? 2 : 1 });
  if (el.id === 'fit-two') { setUi({ fitOpen: false, peek: null }); focusLater('pages-2'); }
};
H.generate = () => generate();
H.saveCv = () => saveCv();
H.toggleJobs = () => {
  const open = !ui.jobOpen;
  setUi({ jobOpen: open, jobQuery: '', jobPending: null, fitOpen: false });
  if (open) focusLater(ui.jobNew ? 'nj-company' : 'job-q');
};
H.jobQuery = (el) => setUi({ jobQuery: el.value });
H.pickJob = (el) => pickJob(el.getAttribute('data-label'));
H.startNewJob = () => startNewJob();
H.cancelSwitch = () => { setUi({ jobPending: null }); focusLater('job-q'); };
H.switchNoSave = () => switchJob(ui.jobPending);
H.saveAndSwitch = () => { const to = ui.jobPending; saveCv(); switchJob(to); };
H.njCompany = (el) => setNewJob({ company: el.value });
H.njRole = (el) => setNewJob({ role: el.value });
H.njKind = (el) => setLink(dataId(el), { kind: el.value, kindSet: true });
H.njUrl = (el) => {
  const l = ui.jobNew.links.find((x) => x.id === dataId(el));
  const guess = l && !l.kindSet ? guessKind(el.value) : null;
  setLink(dataId(el), guess ? { url: el.value, kind: guess } : { url: el.value });
};
H.njRemoveLink = (el) => {
  const links = ui.jobNew.links;
  if (links.length === 1) setLink(dataId(el), { url: '' });
  else setNewJob({ links: links.filter((l) => l.id !== dataId(el)) });
};
H.njAddLink = () => {
  const links = ui.jobNew.links;
  const used = links.map((l) => l.kind);
  const kind = ['posting', 'application', 'company'].find((k) => used.indexOf(k) === -1) || 'other';
  const id = uid('nl');
  setNewJob({ links: links.concat([{ id: id, kind: kind, url: '', kindSet: false }]) });
  focusLater('nl-url-' + id);
};
H.chooseDup = (el) => { setUi({ jobNew: null, jobTried: false }); pickJob(el.getAttribute('data-label')); };
H.cancelNewJob = () => { setUi({ jobNew: null, jobTried: false }); focusLater('job-q'); };
H.createJob = () => createJob();
H.toggleFit = () => {
  const open = !ui.fitOpen;
  setUi({ fitOpen: open, jobOpen: false });
  if (open) focusLater('fit-pop');
};
H.closeFit = () => { setUi({ fitOpen: false, peek: null }); focusLater('fit-btn'); };
H.revert = () => loadSource('saved');
H.source = (el) => loadSource(el.value);
H.toggleAi = () => setC({ aiOpen: !comp().aiOpen });
H.undoAi = () => { undoAi(); focusLater('gen-btn'); };
H.dismissAi = () => { setC({ ai: null, aiOpen: false, undo: null }); focusLater('gen-btn'); };
H.askAnswer = (el) => setAsk(dataId(el), { answer: el.value });
H.askSkip = (el) => setAsk(dataId(el), { status: 'skipped' });
H.askSend = (el) => sendAsk(dataId(el));
H.toggleEdu = () => setC({ edu: comp().edu === false });

function answersFor(label) {
  const j = findJob(label);
  const company = j ? j.company || j.label : String(label || '').split(' · ')[0];
  return questionData()
    .map((q, i) => {
      const adapted = (db.beh.tailored[q.id + '|' + label] || '').trim();
      const general = (db.beh.answers[q.id] || '').trim();
      return { q: q, n: pad2(i + 1), adapted: adapted, answer: adapted || general };
    })
    .filter((x) => x.answer)
    .map((x) => ({
      id: x.q.id, n: x.n, short: x.q.short, full: x.q.full, answer: x.answer, looksFor: x.q.looksFor,
      kind: x.adapted ? 'Adapted for ' + company : 'Generalist',

    }));
}

H.aSave = () => {
  const label = db.analysis.job;

  let added = 0;
  let linked = 0;

  keep.forEach((m) => {
    exps = exps.map((e) => {
      if (e.id !== MADE_BLOCK[m.id]) return e;

// ---- Profile (Education, Technical Skills, Leadership & Achievements), edited like the CV ----
let spyPausedAt = 0;
function markProfileSaved() { setUi({ pSaved: true }); }
function profileGo(section) {
  const sec = ['education', 'skills', 'achievements'].indexOf(section) !== -1 ? section : 'education';
  spyPausedAt = Date.now();
  if (ui.pCurrent !== sec) setUi({ pCurrent: sec });
  const el = document.getElementById(sec);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  const h = document.getElementById(sec + '-h');
  if (h) { try { h.focus({ preventScroll: true }); } catch (err) { /* cannot focus */ } }
}
// Scroll spy: the nav marks the section at the top of the scrolling column.
function profileSpy(box) {
  if (Date.now() - spyPausedAt < 900) return;
  const top = box.getBoundingClientRect().top;
  const ids = ['education', 'skills', 'achievements'];
  let cur = ids[0];
  if (box.scrollTop + box.clientHeight >= box.scrollHeight - 4) cur = ids[ids.length - 1];
  else ids.forEach((id) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top - top <= 80) cur = id; });
  if (cur !== ui.pCurrent) setUi({ pCurrent: cur });
}
function profileHtml() {
  const u = ui.pUndo;
  const saveLabel = !ui.pSaved ? '' : saveState === 'saving' ? 'Saving…' : saveState === 'saved' ? 'Saved in this browser' : 'Not saved: this browser blocks storage';
  const section = (key, id, title, addLabel) => '<section id="' + id + '" aria-labelledby="' + id + '-h" data-focus-sec="' + id + '" style="scroll-margin-top: 16px; display: flex; flex-direction: column; gap: 8px">' +
    '<h2 id="' + id + '-h" class="sec-h" tabindex="-1" style="margin: 0; padding-bottom: 2px; border-bottom: 1px solid #111111; font-size: 15px; line-height: 1.25; font-weight: 600; font-variant: small-caps; letter-spacing: 0.03em">' + title + '</h2>' +
    profListHtml('', key) +
    '<div style="font-family: var(--sans)"><button id="add-' + key + '" type="button" class="add-b" data-act="profAdd" data-pre="" data-k="' + key + '" style="height: 28px; display: inline-flex; align-items: center; gap: 4px; margin-left: -6px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font-size: 12.5px; font-weight: 500; color: #4338CA">' + ic('plus', 13) + addLabel + '</button></div></section>';
  return '<main style="flex: 999 1 560px; min-width: 0; height: 100vh; box-sizing: border-box; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">' +
    '<header style="flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px"><div style="display: flex; flex-direction: column; gap: 2px"><div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px"><p style="' + ST.eyebrow + '">PROFILE</p><h1 id="page-h" class="page-h" tabindex="-1" style="' + ST.h1 + '">The parts of your CV that aren’t blocks</h1></div>' +
    '<p style="margin: 0; font-size: 12px; line-height: 1.4; color: #535A68">Every CV uses these. Edits apply to new CVs and to CVs you open again.</p></div>' +
    '<span aria-live="polite" style="min-height: 18px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; ' + (saveState === 'saved' ? 'color: #15803D;' : 'color: #535A68;') + '">' + when(!!saveLabel && saveState === 'saved', ic('check', 14)) + esc(saveLabel) + '</span></header>' +
    '<div id="pf-scroll" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 12px 0; border-radius: 10px; background: #E4E5E8; display: flex; flex-direction: column; align-items: center">' +
    '<div style="width: 100%; max-width: 760px; box-sizing: border-box; background: #FFFFFF; padding: 26px 34px 30px; box-shadow: 0 6px 20px rgba(20, 22, 27, 0.1); font-family: var(--serif); color: #111111; display: flex; flex-direction: column; gap: 24px">' +
    section('edu', 'education', 'Education', 'Add education') +
    section('skills', 'skills', 'Technical Skills', 'Add a line') +
    section('ach', 'achievements', 'Leadership &amp; Achievements', 'Add an item') +
    '</div>' +
    '<div role="status" aria-live="polite" style="position: sticky; bottom: 12px; z-index: 2; width: 100%; min-height: 16px; display: flex; justify-content: center; pointer-events: none">' +
    when(!!u, '<div style="pointer-events: auto; display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 6px 6px 6px 14px; border-radius: 8px; background: #14161B; color: #FFFFFF; font-size: 12.5px; box-shadow: 0 8px 24px rgba(20, 22, 27, 0.25)"><span>' + esc(u ? 'Removed “' + u.label + '”.' : '') + '</span>' +
      '<button type="button" data-act="pUndo" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: #2A2E37; color: #C7CBFA; font-size: 12.5px; font-weight: 600">Undo</button></div>') +
    '</div></div></main>';
}
H.pUndo = () => {
  const u = ui.pUndo;
  if (!u) return;
  clearTimeout(profUndoTimer);
  profRestore(u);
  setUi({ pUndo: null, pSaved: true });
  focusLater(pfId('', u.key, profKinds()[u.key].first, u.item.id));
};
H.navProfile = (el, ev) => {
  const sec = el.getAttribute('data-sec');
  if (window.location.hash === '#profile/' + sec) {
    if (ev) ev.preventDefault();
    profileGo(sec);
  }
};
H.focusSec = (el) => { const s = el.getAttribute('data-focus-sec'); if (ui.pCurrent !== s) setUi({ pCurrent: s }); };
// ---- Start ----
function init() {
  appEl = document.getElementById('app');
  dynStyle = document.createElement('style');
  dynStyle.id = 'pages-zoom';
  document.head.appendChild(dynStyle);
  db = loadDb();
  ui = Object.assign(freshUi(), { route: '' });
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('dblclick', onDblClick);
  document.addEventListener('mousedown', onMouseDown);
  document.addEventListener('mouseover', (ev) => hoverDispatch(ev, 'data-enter'));
  document.addEventListener('mouseout', (ev) => hoverDispatch(ev, 'data-leave'));
  document.addEventListener('focusin', (ev) => {
    const sec = closestAttr(ev.target, 'data-focus-sec');
    if (sec) call('focusSec', sec, ev);
    hoverDispatch(ev, 'data-enter');
  });
  document.addEventListener('focusout', (ev) => hoverDispatch(ev, 'data-leave'));
  document.addEventListener('dragstart', onDragStart);
  document.addEventListener('dragover', onDragOver);
  document.addEventListener('drop', onDrop);
  document.addEventListener('dragend', onDragEnd);
  document.addEventListener('scroll', onScroll, true);
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('storage', onStorageEvent);
  window.addEventListener('resize', fitPages);
  const flushNow = () => { if (saveTimer) flushSave(); };
  window.addEventListener('pagehide', flushNow);
  window.addEventListener('beforeunload', flushNow);
  // Fonts change text width; redraw page scaling once they arrive.
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPages); } catch (err) { /* no font loading API */ }
  onRoute();
}
init();
</script>
